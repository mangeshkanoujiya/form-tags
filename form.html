<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
            .main{
width: 500px;
margin: auto;
text-align: center;
background-color: aqua;
padding: 20px;
/* border-radius: 10px; */
}
    </style>
</head>
<body>
    <div class="main">
    <H2>Use of form tags</H2>
    <label for="">First name: </label>
    <input type="" placeholder="Enter first name" >
    <br><br>
    <label for="">Last name:</label>
    <input type="" placeholder="Enter your last name">
<br><br>
     <label for="address">Person address:</label>
     <textarea name="address" id=""></textarea>

<br><br>
    <label for="">Gender:</label>
    <input type="radio" name="gender">
    <label for="">Male</label>
    <input type="radio" name="gender">
    <label for="">Female</label>
    <input type="radio" name="gender">
    <label for="">other</label>
<br><br>
     <label for="">maritial status:</label>
      <input type="checkbox">
       <label for="">Married</label>

<br> <br>
     <label for="">Qualification:</label>
     <select name="Qualification" id="">
        <option value="">BSC.cs</option>
        <option value="">B.tech</option>
        <option value="">HSC</option>
        <option value="">SSC</option>
     </select>
<br> <br>
      <label for="">language know:</label>
      <select multiple>
        <option value="">Hindi</option>
        <option value="">Telgu</option>
        <option value="">Tamil</option>
        <option value="">Kannada</option>
        <option value="">English</option>
      </select>
<br><br>

      <label for="">hobbies</label>
      <input type="checkbox">
      <label for="">cricket</label>
      <input type="checkbox">
      <label for="">football</label>
      <input type="checkbox">
      <label for="">hockey</label>
      <input type="checkbox">
      <label for="">kabbadi</label>
<br><br>
      <label for="">DOB:</label>
      <input type="date">
<br><br>
      <label for="">Time of birth:</label>
      <input type="time">
<br><br>
       <label for="">month of birth:</label>
       <input type="month">
<br><br>
        <label for="">week no of the birth year:</label>
        <input type="week">
<br><br>
        <label for="">select the range</label>
        <input type="range">
<br><br>
        <label for="">Phone number:</label>
        <input type="tel" maxlength="10" placeholder="enter phone number">
<br><br>
         <label for="">Email id:</label>
         <input type="email" placeholder="enter email id">
<br><br>
         <label for="">Select Fav color:</label>
         <input type="color">
<br> <br>
        <label for="">Person Income:</label>
        <input type="number">
<br><br>
         <label for="">FaceBook url:</label>
         <input type="url">
<br><br>
         <label for="">Fav google search engine</label>
         <input type="string">
<br> <br>
         <button>Process the details</button> &nbsp; &nbsp; &nbsp; &nbsp;
         <button>Cancel</button>
</div>
    </body>
</html>
